<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Selaso Jatuh Kembar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="overlay">
      <h1>Selaso Jatuh Kembar</h1>
      <div class="sub">Rumah adat Melayu Riau, a 3D walkthrough</div>
      <div class="btns">
        <button class="primary" id="explore">Explore on foot</button>
        <button id="tour">Cinematic tour</button>
      </div>
      <div class="keys">
        <kbd>W A S D</kbd> move &nbsp; <kbd>Shift</kbd> run &nbsp;
        <kbd>Space</kbd> jump &nbsp; mouse to look<br />
        <kbd>1</kbd>–<kbd>4</kbd> teleport &nbsp; <kbd>N</kbd> change time of
        day &nbsp; <kbd>Esc</kbd> pause
      </div>
    </div>
    <div id="time">
      <button data-t="day">Day</button
      ><button data-t="golden">Golden hour</button
      ><button data-t="night">Night</button>
    </div>
    <div id="cross"></div>
    <div id="caption"></div>
    <div id="hud">1 Plaza · 2 Selaso · 3 Balai · 4 Pelaminan</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
